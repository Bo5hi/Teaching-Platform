:root {
  --red: #C8102E;
  --red-dark: #8E0C22;
  --red-tint: #FBE9EC;
  --ink: #16191D;
  --ink-soft: #3B4149;
  --muted: #6B7280;
  --line: #E4E7EB;
  --bg: #FFFFFF;
  --bg-soft: #F6F7F9;
  --bg-soft-2: #EEF1F4;
  --good: #1B873F;
  --good-tint: #E6F4EA;
  --bad: #C8102E;
  --bad-tint: #FBE9EC;
  --gold: #B7791F;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 1px 3px rgba(16,25,29,.08), 0 6px 24px rgba(16,25,29,.06);
  --shadow-lg: 0 8px 40px rgba(16,25,29,.14);
  --maxw: 1120px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.65;
  font-size: 17px;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--red-dark); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 24px; }
.btn:hover { text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--red); color: #fff; box-shadow: var(--shadow); }
.btn-primary:hover { background: var(--red-dark); color: #fff; }
.btn-ghost { background: #fff; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { background: var(--bg-soft); color: var(--ink); }
.muted { color: var(--muted); }
.btn-sm { padding: 7px 12px; font-size: 14px; }
.crumbs { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
.crumbs a { color: var(--muted); font-weight: 600; }
.week-hero .wh-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.week-hero .big-num {
  width: 58px; height: 58px; border-radius: 14px; background: var(--red); color: #fff;
  display: grid; place-items: center; font-weight: 800; font-size: 24px; flex: 0 0 auto;
}
.week-hero h1 { font-size: clamp(26px, 4vw, 38px); margin: 6px 0 8px; letter-spacing: -.4px; }
.week-hero .overview { font-size: 18px; color: var(--ink-soft); max-width: 780px; margin: 18px 0 0; }
.callout h3 { margin: 0 0 6px; font-size: 19px; }
.callout .goal { color: var(--ink-soft); margin: 0 0 12px; }
.callout ol, .callout ul { margin: 8px 0 0; padding-left: 22px; }
.callout li { margin-bottom: 6px; }
body { font-size: 16px; }
.site-top { background:#050510; color:#fff; padding:10px 24px; display:flex; align-items:center; gap:12px; }
.site-top img { width:34px; height:34px; object-fit:contain; }
.site-top a { color:#c8d8e8; text-decoration:none; font-size:14px; }
.site-top .brand { font-weight:800; letter-spacing:2px; margin-right:auto; color:#fff; }
.gate { max-width:520px; margin:80px auto; padding:0 24px; text-align:center; }
/* ---------- interview simulator (Week 9) ---------- */
/* hub: the list of people */
.iv-wrap { padding-block: 28px 70px; }
.iv-cards { display: grid; gap: 12px; margin-top: 20px; }
.iv-card { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; background: #fff; box-shadow: var(--shadow); }
.iv-card.is-done { border-left: 5px solid var(--good); }
.iv-card-main { flex: 1; min-width: 220px; }
.iv-avatar { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: var(--red-tint); color: var(--red-dark); font-weight: 800; flex: none; }
.iv-name { font-size: 17px; }
.iv-meta { font-size: 13.5px; }
.iv-status { font-size: 14px; font-weight: 600; color: var(--ink-soft); margin-top: 2px; }

/* session: "interview mode" fills the whole window. The conversation scrolls on its own; the four
   choices sit in a fixed dock at the bottom so they are always fully visible. */
body.iv-mode { overflow: hidden; }
body.iv-mode .site-header, body.iv-mode .preview-banner, body.iv-mode .site-footer { display: none; }
.iv-app { display: flex; flex-direction: column; height: 100vh; padding: 0; background: #fff; }
.iv-top { display: flex; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); flex: none; }
.iv-backlink { font-size: 22px; line-height: 1; text-decoration: none; color: var(--ink-soft); padding: 4px 6px; border-radius: 6px; }
.iv-backlink:hover { background: var(--bg-soft); text-decoration: none; }
.iv-top-main { flex: 1; min-width: 0; }
.iv-top-main .iv-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iv-top-time { min-width: 170px; }
.iv-time { font-size: 15px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
.iv-time.low { color: var(--red); }
.iv-bar { height: 6px; width: 180px; max-width: 100%; background: var(--bg-soft-2); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.iv-bar-fill { height: 100%; width: 0; background: #1F4E9B; transition: width .3s; }
.iv-bar-fill.low { background: var(--red); }
.iv-head-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.iv-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
.iv-main { display: flex; flex-direction: column; min-height: 0; }
.iv-chat { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px; background: var(--bg-soft); }
.iv-log { display: grid; gap: 10px; max-width: 980px; margin: 0 auto; }
.iv-msg { max-width: 80%; border-radius: 12px; padding: 10px 14px; box-shadow: 0 1px 2px rgba(16,25,29,.06); }
.iv-msg.them { background: #fff; justify-self: start; border-top-left-radius: 4px; }
.iv-msg.you { background: #E3ECFA; justify-self: end; border-top-right-radius: 4px; }
.iv-who { font-size: 11.5px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .4px; }
.iv-text { white-space: pre-wrap; font-size: 16.5px; }
.iv-evlinks { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.iv-ev { font-size: 14px; font-weight: 700; }
.iv-dots { display: inline-flex; gap: 4px; padding: 6px 0 2px; }
.iv-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: iv-blink 1s infinite ease-in-out; }
.iv-dots span:nth-child(2) { animation-delay: .15s; }
.iv-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes iv-blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.iv-dock { flex: none; border-top: 1px solid var(--line); background: #fff; padding: 10px 18px 14px; box-shadow: 0 -4px 14px rgba(16,25,29,.05); }
.iv-dock-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.iv-dock-head b { font-size: 15px; }
.iv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.iv-q { display: flex; gap: 10px; align-items: flex-start; text-align: left; font: inherit; font-size: 15px; line-height: 1.4; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); cursor: pointer; }
.iv-q:hover:not(:disabled), .iv-q:focus-visible { border-color: #1F4E9B; background: #F4F8FE; outline: none; }
.iv-q:disabled { opacity: .5; cursor: wait; }
.iv-q.is-asked { opacity: .55; }
.iv-qn { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--bg-soft-2); color: var(--ink-soft); font-size: 13px; font-weight: 800; margin-top: 1px; }
.iv-qt { flex: 1; }
.iv-asked { flex: none; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.iv-chips { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 8px; margin-bottom: 2px; }
.iv-chip { position: relative; flex: none; white-space: nowrap; font: inherit; font-size: 13px; font-weight: 600; padding: 5px 10px; border: 1px solid var(--line); border-radius: 99px; background: #fff; color: var(--ink-soft); cursor: pointer; }
.iv-chip:hover:not(:disabled) { border-color: #1F4E9B; }
.iv-chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }
.iv-chip.is-done { opacity: .5; cursor: default; text-decoration: line-through; }
.iv-chip-n { margin-left: 6px; font-size: 11.5px; opacity: .7; }
.iv-ready { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.iv-ready h3 { margin: 0 0 4px; }
.iv-ready p { margin: 0 0 4px; max-width: 760px; }
.iv-side { border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px; background: #fff; }
.iv-side-block { margin-bottom: 18px; }
.iv-side-block h4 { margin: 0 0 8px; }
.iv-debrief-card h3 { margin: 0 0 6px; }
.iv-debrief-card h4 { margin: 14px 0 6px; }
.iv-debrief-card ul { padding-left: 20px; margin: 0; }
.iv-quality li.good b { color: var(--good); }
.iv-quality li.weak b { color: var(--red-dark); }
.iv-next { background: var(--bg-soft); border-radius: 8px; padding: 10px 12px; font-weight: 600; margin-top: 12px; }
.iv-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
[dir="rtl"] .iv-q { text-align: right; }
[dir="rtl"] .iv-side { border-left: 0; border-right: 1px solid var(--line); }
@media (max-width: 1100px) { .iv-body { grid-template-columns: minmax(0, 1fr) 240px; } }
@media (max-width: 860px) {
  .iv-body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
  .iv-side { border-left: 0; border-top: 1px solid var(--line); max-height: 28vh; }
  .iv-grid { grid-template-columns: 1fr; }
  .iv-msg { max-width: 94%; }
  .iv-top { flex-wrap: wrap; }
  .iv-top-time { order: 5; width: 100%; }
  .iv-bar { width: 100%; }
}

      ]),

  function printTranscript(iv, st, learnerName) {

    st.asked.forEach(function (qid) {
      var x = ivFind(iv, qid);
      if (!x) return;
      rows.push("<p class=\"q\"><b>" + esc(t("iv_you")) + ":</b> " + esc(x.q.ask) + "</p>");
      rows.push("<p><b>" + esc(iv.name) + ":</b> " + esc(x.q.answer) + ((x.q.evidence || []).length ? " <i>[" + esc(x.q.evidence.join(", ")) + "]</i>" : "") + "</p>");
    });
    if (st.done) rows.push("<p><b>" + esc(iv.name) + ":</b> " + esc(iv.closing) + "</p>");
    var ev = ivEvidence(iv, st);
    var win = window.open("", "_blank");
    if (!win) return;
    win.document.write("<!doctype html><html><head><meta charset=\"utf-8\"><title>" + esc(iv.id + " " + iv.name) + "</title>" +
      "<style>body{font:15px/1.6 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#16191D;max-width:760px;margin:32px auto;padding:0 20px}" +
      "h1{font-size:22px;margin:0 0 4px}.meta{color:#6B7280;margin:0 0 16px}.q{margin-top:16px}</style></head><body>" +
      "<h1>" + esc(iv.id + " · " + iv.name + ", " + iv.role) + "</h1>" +
      "<p class=\"meta\">" + esc(iv.setting) + " · " + esc(learnerName || (USER && USER.name) || "") + " · Northgate Supply Co. (fictional training scenario)</p>" +
      rows.join("") + "<p><b>" + esc(t("iv_evidence")) + ":</b> " + esc(ev.join(", ") || "—") + "</p></body></html>");
    win.document.close();
    win.focus();
    win.print();
  }


  /* ---------- boot: identify the student from their Hub sign-in, then load saved interviews ---------- */
  document.addEventListener("DOMContentLoaded", function () {
    var id = localStorage.getItem("hub_id"), name = localStorage.getItem("hub_name");
    if (!id) {
      mount([header(), el("div", { class: "gate" }, [
        el("h2", { text: "Sign in first" }),
        el("p", { text: "Sign in on the MCCoE Hub, then come back to this page to start your Northgate interviews." }),
        el("a", { class: "btn btn-primary", href: "MCCoE_Hub.html" }, ["Go to the Hub"])
      ])]);
      return;
    }
    USER = { id: id, name: name || "" };
    function fromLocal() {
      try { PROG = { _interviews: JSON.parse(localStorage.getItem("mccoe_iv_" + id) || "{}") }; } catch (e) { PROG = { _interviews: {} }; }
    }
    // Use the saved copy in Firebase; fall back to this browser's copy if Firebase is slow or unreachable.
    var slow = new Promise(function (_, reject) { setTimeout(function () { reject(new Error("timeout")); }, 4000); });
    Promise.race([db.ref("mccoe_interviews/" + id).once("value"), slow]).then(function (snap) {
      PROG = { _interviews: snap.val() || {} };
    }).catch(fromLocal).then(renderInterview);
  });
})();
</script>
