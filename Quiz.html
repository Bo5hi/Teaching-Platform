<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Quiz | MCCoE</title>
<link rel="stylesheet" href="course.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="course.js"></script>
<script src="course-data.js"></script>
<style>
.meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0 18px; color: var(--muted); font-size: .95rem; }
.result { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 16px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); margin-bottom: 18px; }
.review-l { font-size: .85rem; color: var(--faint); margin-top: 6px; }
.review-l a { color: var(--cyan); }
</style>
</head>
<body>
<header id="cc-top"></header>
<main class="cc-main cc-read" id="page"><div class="empty">Loading quiz...</div></main>
<script>
(function () {
  CC.header('week');
  var w = CC.param('w') || '1';
  var href = 'Quiz.html?w=' + w + (CC.param('from') ? '&from=' + CC.param('from') : '');
  var page = document.getElementById('page');
  var esc = CC.esc;
  var Q, qs, prev;

  CC.require('course-w' + w + '-lessons.js').then(function () {
    Q = (window.COURSE_QUIZ || {})['w' + w];
    if (!Q) { page.innerHTML = '<div class="empty">The Week ' + esc(w) + ' quiz is not available yet.</div>'; return; }
    document.title = Q.title + ' | MCCoE';
    CC.load().then(function (rec) { prev = (rec.quiz || {})['w' + w]; start(); });
  }).catch(function (e) { page.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });

  function start() {
    qs = CC.shuffle(Q.questions).map(function (q) {
      var order = CC.shuffle(q.opts.map(function (_, j) { return j; }));
      return { q: q, order: order };
    });
    page.innerHTML = CC.crumb(href, 'Quiz') +
      '<h1 class="cc-h1">' + esc(Q.title) + '</h1>' +
      '<div class="meta"><span class="chip c-quiz">Quiz</span><span>' + qs.length + ' questions</span><span>&middot; ' + Q.pass + '% to pass</span><span>&middot; Retakes allowed</span>' +
      (prev ? '<span>&middot; Your best: ' + prev.best + '% (' + prev.attempts + ' attempt' + (prev.attempts === 1 ? '' : 's') + ')</span>' : '') + '</div>' +
      '<div id="res"></div>' +
      '<form id="qf">' + qs.map(function (x, i) {
        return '<div class="q" data-i="' + i + '"><div class="qn">Question ' + (i + 1) + ' of ' + qs.length + '</div><div class="qt">' + esc(x.q.q) + '</div>' +
          x.order.map(function (j) { return '<label class="opt"><input type="radio" name="q' + i + '" value="' + j + '"><span>' + esc(x.q.opts[j]) + '</span></label>'; }).join('') +
          '<div class="why" hidden></div></div>';
      }).join('') + '<button class="btn primary" type="submit">Submit quiz</button></form>' +
      '<div class="done-bar"><span class="sub" id="doneMsg">Submit the quiz to mark it done.</span>' + CC.nextButton(href) + '</div>';
    document.getElementById('qf').addEventListener('submit', grade);
  }

  function grade(e) {
    e.preventDefault();
    var f = e.target, blank = 0;
    qs.forEach(function (x, i) { if (!f.querySelector('input[name="q' + i + '"]:checked')) blank++; });
    if (blank) { CC.toast('Answer every question first (' + blank + ' left).'); return; }
    var right = 0, missed = [];
    qs.forEach(function (x, i) {
      var box = f.querySelector('.q[data-i="' + i + '"]');
      var sel = +f.querySelector('input[name="q' + i + '"]:checked').value;
      box.querySelectorAll('.opt').forEach(function (o) {
        var v = +o.querySelector('input').value;
        o.classList.toggle('right', v === x.q.ans);
        o.classList.toggle('wrong', v === sel && sel !== x.q.ans);
        o.querySelector('input').disabled = true;
      });
      if (sel === x.q.ans) right++; else missed.push(Q.questions.indexOf(x.q));
      var wEl = box.querySelector('.why'); wEl.hidden = false;
      wEl.innerHTML = esc(x.q.why || '') + (x.q.lesson ? '<div class="review-l">Review: <a href="' + esc(CC.link('Lesson.html?l=' + x.q.lesson)) + '">Lesson ' + esc(x.q.lesson) + '</a></div>' : '');
    });
    var pct = Math.round(right / qs.length * 100), passed = pct >= Q.pass;
    var best = Math.max((prev && prev.best) || 0, pct), attempts = ((prev && prev.attempts) || 0) + 1;
    prev = { best: best, last: pct, attempts: attempts, passed: best >= Q.pass, at: new Date().toISOString(), missed: missed };
    CC.save('quiz/w' + w, prev);
    CC.markDoneFor(href);
    f.querySelector('button[type=submit]').outerHTML = '<button class="btn" type="button" id="retake">Retake with new order</button>';
    document.getElementById('retake').addEventListener('click', function () { start(); window.scrollTo(0, 0); });
    document.getElementById('res').innerHTML = '<div class="result"><span class="score" style="color:' + (passed ? 'var(--ok)' : 'var(--warn)') + '">' + pct + '%</span><span class="sub">' + right + ' of ' + qs.length + ' correct. ' +
      (passed ? 'You passed.' : 'You need ' + Q.pass + '% to pass. Review the explanations and the linked lessons, then retake it.') + ' Best so far: ' + best + '%.</span></div>';
    document.getElementById('doneMsg').textContent = 'Quiz marked done.';
    window.scrollTo(0, 0);
  }
})();
</script>
</body>
</html>
