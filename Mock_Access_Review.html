<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Access Review | MCCoE</title>
<link rel="stylesheet" href="course.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="course.js"></script>
<script src="course-data.js"></script>
<script src="course-w3-mock.js"></script>
<style>
section.sec { scroll-margin-top: 76px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.table-wrap { position: relative; overflow-x: auto; }
.statline { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 10px 0 18px; font-size: .95rem; }
.pill { display: inline-block; font-size: .8rem; font-weight: 700; letter-spacing: .5px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line-soft); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill.ok { color: var(--ok); border-color: rgba(51, 209, 122, .5); }
.pill.sub { color: var(--cyan); border-color: rgba(0, 245, 255, .45); }
.pill.warn { color: var(--warn); border-color: rgba(255, 194, 61, .5); }
.saved { color: var(--muted); }
.saved.err { color: var(--warn); }
.preview-note { font-size: .9rem; color: var(--warn); border: 1px dashed rgba(255, 194, 61, .45); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }

.brief .from { font-family: var(--f-mono); font-size: .76rem; letter-spacing: 1.2px; text-transform: uppercase; color: var(--t-mock); }
.brief .prose p { margin-bottom: 10px; }
details.more { margin-top: 4px; }
details.more summary { cursor: pointer; color: var(--cyan); font-weight: 700; font-size: .95rem; }
details.more ol { font-family: var(--f-read); font-size: .92rem; color: #dcdce4; padding-left: 22px; margin: 10px 0 0; line-height: 1.55; }
details.more ol li { margin-bottom: 6px; }
details.more ol b { color: var(--text); }

.steps5 { list-style: none; padding: 0; margin: 20px 0 12px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 900px) { .steps5 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } }
.steps5 a { display: flex; gap: 10px; align-items: center; height: 100%; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; text-decoration: none; color: var(--text); }
.steps5 a:hover { border-color: rgba(255, 255, 255, .25); }
.steps5 .sn { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--red); color: var(--red); font-family: var(--f-display); font-size: .8rem; }
.steps5 .st { display: grid; line-height: 1.2; min-width: 0; }
.steps5 .st b { font-weight: 700; font-size: .98rem; }
.steps5 .st small { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.steps5 li.ok .sn { background: var(--ok); border-color: var(--ok); color: #07070f; }
.steps5 li.ok .st small { color: var(--ok); }

.p1bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px; border: 1px solid var(--line-soft); border-left: 3px solid var(--cyan); border-radius: 0 10px 10px 0; background: rgba(0, 245, 255, .04); font-size: .97rem; }
.p1bar .muted { color: var(--muted); }

.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 38px 0 6px; }
.sec-h h2.cc-h2 { margin: 0; }
.sec-intro { font-family: var(--f-read); font-size: .95rem; color: var(--muted); max-width: 80ch; margin: 0 0 12px; line-height: 1.6; font-weight: 400; }
.sec-intro b { color: var(--text); font-weight: 600; }
.issues { font-size: .9rem; color: var(--warn); margin: 8px 0 0; min-height: 1px; }

/* evidence */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tabs button { background: var(--panel); border: 1px solid var(--line-soft); color: var(--text); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 700; font-size: .92rem; }
.tabs button[aria-selected="true"] { border-color: var(--red); background: rgba(238, 34, 7, .1); }
.tabs button.v::after { content: " \2713"; color: var(--ok); }
.evbox { padding: 12px 14px; }
.evtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.evtools input[type=search] { max-width: 320px; }
.evtools select { width: auto; }
.evcount { color: var(--muted); font-size: .88rem; }
.evscroll { max-height: 460px; overflow: auto; border: 1px solid var(--line-soft); border-radius: 8px; }
table.ev { width: 100%; border-collapse: collapse; font-size: .84rem; }
table.ev th { position: sticky; top: 0; background: #15152c; text-align: left; padding: 6px 8px; font-size: .76rem; letter-spacing: .4px; color: var(--muted); white-space: nowrap; z-index: 1; }
table.ev td { padding: 5px 8px; border-top: 1px solid var(--line-soft); white-space: nowrap; font-family: var(--f-mono); }
table.ev td.wrap { white-space: normal; font-family: var(--f-read); min-width: 220px; }
table.ev tr.off td { color: var(--faint); }
pre.memo { white-space: pre-wrap; font-family: var(--f-mono); font-size: .85rem; line-height: 1.5; background: rgba(0, 0, 0, .25); border: 1px solid var(--line-soft); border-radius: 8px; padding: 12px; margin: 0 0 12px; color: #dcdce4; }
.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.gcard { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 12px; }
.gcard h4 { margin: 0 0 6px; font-family: var(--f-mono); font-weight: 400; font-size: .85rem; color: var(--cyan); display: flex; justify-content: space-between; gap: 8px; }
.gcard ul { margin: 0; padding-left: 16px; font-size: .86rem; line-height: 1.5; }
.gcard li span { color: var(--muted); }
.evnote { font-family: var(--f-read); font-size: .9rem; color: var(--muted); margin: 0 0 10px; }

/* findings */
.cards { display: grid; gap: 12px; }
.fcard { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 14px; }
.fcard.flash { border-color: var(--cyan); }
.fcard .gh { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.fcard .gh .gt { font-family: var(--f-display); font-size: .85rem; letter-spacing: 1px; color: var(--t-mock); }
.fcard .gh .grow { flex: 1; }
.fcard .gh input.acct { width: 200px; }
.fcard .gh .rank { display: flex; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); }
.fcard .gh .rank input { width: 70px; }
.fcard .gg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 14px; }
@media (max-width: 760px) { .fcard .gg { grid-template-columns: minmax(0, 1fr); } }
.fcard .f { display: grid; gap: 4px; align-content: start; }
.fcard .f label, .fcard .f .lb { font-size: .88rem; font-weight: 700; color: var(--muted); }
.fcard textarea { min-height: 62px; }
.fcard .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.checks2 { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .9rem; }
.checks2 label { display: flex; gap: 6px; align-items: center; font-weight: 500; color: var(--text); }
.shead { font-family: var(--f-mono); font-size: .9rem; color: var(--cyan); }
.scont { font-family: var(--f-read); font-size: .92rem; color: #dcdce4; margin: 4px 0 6px; }
.sperm { font-size: .85rem; color: var(--muted); margin-bottom: 10px; }
.sperm code { color: var(--text); }
button.x { background: none; border: 1px solid transparent; color: var(--faint); border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-size: 1.2rem; line-height: 1; }
button.x:hover { color: var(--bad); border-color: rgba(255, 90, 90, .4); }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.undo { font-size: .92rem; color: var(--muted); }
.undo button { margin-left: 6px; }
.qbox { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.qbox .qh { font-weight: 700; margin-bottom: 6px; }
.qbox .qs { font-family: var(--f-read); font-size: .9rem; color: var(--muted); margin-bottom: 8px; }
.sevb { font-size: .8rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-soft); color: var(--muted); }

.sumgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .sumgrid { grid-template-columns: minmax(0, 1fr); } }
.sumgrid textarea { min-height: 240px; }
.sumgrid ul { margin: 0; padding-left: 18px; font-family: var(--f-read); font-size: .92rem; color: #dcdce4; line-height: 1.55; font-weight: 400; }
.sumgrid li { margin-bottom: 5px; }
.wc { font-size: .9rem; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.wc.ok { color: var(--ok); }

.confirm { margin-top: 12px; border-color: var(--line); }
.confirm:focus { outline: none; }
.confirm h3 { font-family: var(--f-body); font-size: 1.2rem; text-transform: none; letter-spacing: .2px; color: var(--text); font-weight: 700; }
.checks { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 4px; }
.checks li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); font-size: .97rem; }
.checks li .r { font-weight: 700; white-space: nowrap; }
.checks li.ok .r { color: var(--ok); } .checks li.short .r { color: var(--warn); }
.confirm p { font-family: var(--f-read); font-size: .95rem; color: #dcdce4; font-weight: 400; margin: 0 0 12px; }
.confirm .btns { display: flex; gap: 10px; flex-wrap: wrap; }

.grade { border-color: rgba(51, 209, 122, .45); margin-bottom: 18px; }
.grade .gtop { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.grade .score span { font-size: 1rem; color: var(--muted); }
.grade table.cc td.pts { white-space: nowrap; font-weight: 700; text-align: right; }
.grade table.cc td .d { color: var(--muted); font-size: .88rem; }
.grade .fb { font-family: var(--f-read); font-size: .95rem; font-weight: 400; color: #dcdce4; white-space: pre-wrap; margin-top: 12px; line-height: 1.6; }
.grade .gby { font-size: .85rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<header id="cc-top"></header>
<main class="cc-main" id="page"><div class="empty">Loading the access review...</div></main>
<script>
(function () {
  CC.header('week');
  var M = window.MOCK_W3;
  var esc = CC.esc;
  var page = document.getElementById('page');
  if (!M || !M.evidence) { page.innerHTML = '<div class="empty">The review data (course-w3-mock.js) did not load. Refresh the page.</div>'; return; }
  var E = M.evidence;

  var me = CC.student();
  var LKEY = 'cc_mock_w3_' + (me.key || 'preview');
  var PATH = 'mccoe_mockproj/' + me.key + '/w3';
  var WEEK = ((window.COURSE && COURSE.weeks) || []).filter(function (w) { return w.num === 3; })[0] || {};
  var RUBRIC = (WEEK.mock && WEEK.mock.rubric) || M.rubric || [];
  var PART1_BLOCK = 'w3d1-b9', SUBMIT_BLOCK = 'w3d2-b4';
  var T = { findings: 10, words: 100 };
  var TABS = [['acc', 'Accounts'], ['grp', 'Groups'], ['hr', 'HR roster'], ['vpn', 'VPN'], ['shr', 'Shares'], ['memo', 'Memos']];
  var SAMS = E.ad.map(function (r) { return r[0]; });
  var NAME = {}; E.ad.forEach(function (r) { NAME[r[0]] = r[1]; });
  var VPNU = E.groups['VPN-Users'] || [];

  var S = null;
  var meta = { status: 'draft', submittedAt: null, submitCount: 0, changedSinceSubmit: false, savedAt: null, grade: null };
  var part1Done = false, remoteOk = false, saveT = null, lastDel = null, tab = 'acc';
  var filt = { acc: '', accEn: 'all', hr: '', hrOnly: false, vpn: '' };

  // ---------- storage ----------
  function readLocal() { try { return JSON.parse(localStorage.getItem(LKEY) || 'null'); } catch (e) { return null; } }
  function writeLocal(rec) { try { localStorage.setItem(LKEY, JSON.stringify(rec)); } catch (e) {} }
  function fetchRemote() {
    if (!CC.online) return Promise.resolve({ ok: false, val: null });
    return new Promise(function (res) {
      var settled = false;
      var t = setTimeout(function () { if (!settled) { settled = true; res({ ok: false, val: null }); } }, 8000);
      CC.db.ref(PATH).once('value').then(function (s) {
        if (settled) return; settled = true; clearTimeout(t); res({ ok: true, val: s.val() });
      }, function () {
        if (settled) return; settled = true; clearTimeout(t); res({ ok: false, val: null });
      });
    });
  }
  function list(x) {
    if (!x) return [];
    if (Array.isArray(x)) return x.filter(function (v) { return v != null; });
    return Object.keys(x).sort(function (a, b) { return a - b; }).map(function (k) { return x[k]; }).filter(function (v) { return v != null; });
  }
  function str(v) { return v == null ? '' : String(v); }
  function finding(r) { r = r || {}; return { acct: str(r.acct), type: str(r.type), type2: str(r.type2), sev: str(r.sev), evidence: str(r.evidence), action: str(r.action), detail: str(r.detail), rank: str(r.rank) }; }
  function share(r) { r = r || {}; return { cls: str(r.cls), data: list(r.data).map(str), owner: str(r.owner), verdict: str(r.verdict), fix: str(r.fix) }; }
  function normData(d) {
    d = d || {};
    var v = d.vpn || {}, sh = d.shares || {}, out = {};
    E.shares.forEach(function (s) { out[s.id] = share(sh[s.id]); });
    return {
      viewed: list(d.viewed).filter(function (t) { return TABS.some(function (x) { return x[0] === t; }); }),
      findings: list(d.findings).map(finding),
      vpn: { notEnrolled: list(v.notEnrolled).map(str), usedLegacy: list(v.usedLegacy).map(str), enrolledCan: str(v.enrolledCan), fix: str(v.fix), colonial: str(v.colonial) },
      shares: out,
      summary: str(d.summary)
    };
  }

  function setSave(state, at) {
    var el = document.getElementById('saved');
    if (!el) return;
    var t = at ? ' ' + clock(at) : '';
    el.className = 'saved' + (state === 'err' ? ' err' : '');
    el.textContent = state === 'pending' ? 'Saving...' :
      state === 'ok' ? 'Saved' + t :
      state === 'local' ? 'Saved on this computer' + t :
      state === 'err' ? 'Could not reach the server. Saved on this computer' + t + '.' : '';
  }
  function persist() {
    clearTimeout(saveT); saveT = null;
    var now = new Date().toISOString();
    meta.savedAt = now;
    var payload = {
      name: me.name || null, id: me.id || null,
      status: meta.status, savedAt: now,
      submittedAt: meta.submittedAt || null,
      submitCount: meta.submitCount || 0,
      changedSinceSubmit: !!meta.changedSinceSubmit,
      data: JSON.parse(JSON.stringify(S))
    };
    var localRec = JSON.parse(JSON.stringify(payload));
    localRec.grade = meta.grade || null;
    writeLocal(localRec);
    if (CC.online && remoteOk) {
      return CC.db.ref(PATH).update(payload).then(function () { setSave('ok', now); }, function () { setSave('err', now); });
    }
    setSave('local', now);
    return Promise.resolve();
  }
  function changed() {
    if (meta.status === 'submitted') meta.changedSinceSubmit = true;
    setSave('pending');
    clearTimeout(saveT);
    saveT = setTimeout(persist, 900);
    refresh();
  }
  function flush() { if (saveT) persist(); }
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });

  // ---------- helpers ----------
  function clock(iso) { try { return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } }
  function when(iso) { try { return new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (e) { return iso || ''; } }
  function words(s) { var m = String(s || '').trim().match(/\S+/g); return m ? m.length : 0; }
  function filled(v) { return String(v || '').trim() !== ''; }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function opts(values, val, ph) {
    return '<option value="">' + esc(ph) + '</option>' + values.map(function (o) {
      return '<option value="' + esc(o) + '"' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join('');
  }
  function attrs(t, i, f, label) { return ' data-t="' + t + '" data-i="' + esc(i) + '" data-f="' + f + '" aria-label="' + esc(label) + '"'; }
  function ta(t, i, f, val, label, ph, id) { return '<textarea' + (id ? ' id="' + id + '"' : '') + attrs(t, i, f, label) + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '>' + esc(val) + '</textarea>'; }
  function sel(t, i, f, values, val, label, ph, id) { return '<select' + (id ? ' id="' + id + '"' : '') + attrs(t, i, f, label) + '>' + opts(values, val, ph) + '</select>'; }
  function inp(t, i, f, val, label, ph, extra) { return '<input type="text"' + attrs(t, i, f, label) + ' value="' + esc(val) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + (extra || '') + '>'; }

  // ---------- counts ----------
  function counts() {
    var f = S.findings.filter(function (x) { return filled(x.acct); });
    var sh = E.shares.map(function (s) { return S.shares[s.id]; });
    var v = S.vpn;
    return {
      viewed: S.viewed.length,
      findings: f.length,
      fNoType: f.filter(function (x) { return !x.type || !x.sev; }).length,
      fNoAction: f.filter(function (x) { return !x.action; }).length,
      fNoEvidence: f.filter(function (x) { return !filled(x.evidence); }).length,
      fNoRank: f.filter(function (x) { return !filled(x.rank); }).length,
      vpnDone: (v.notEnrolled.length > 0 && v.usedLegacy.length > 0 && !!v.enrolledCan && filled(v.fix) && words(v.colonial) >= 25),
      sharesDone: sh.filter(function (x) { return x.cls && x.verdict; }).length,
      sharesNoOwner: sh.filter(function (x) { return x.cls && !filled(x.owner); }).length,
      words: words(S.summary)
    };
  }
  function part1Ready(c) { return c.viewed >= 4 && c.findings >= 6; }
  function setPill(id, n, target, unit) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = n + ' of ' + target + ' ' + unit;
    el.className = 'pill' + (n >= target ? ' ok' : '');
  }
  function issue(id, parts) { var el = document.getElementById(id); if (el) el.textContent = parts.filter(Boolean).join(' '); }

  function refresh() {
    if (!S) return;
    var c = counts();
    setPill('pill-ev', c.viewed, TABS.length, 'opened');
    setPill('pill-f', c.findings, T.findings, 'findings');
    setPill('pill-sh', c.sharesDone, E.shares.length, 'shares');
    var vp = document.getElementById('pill-vpn');
    if (vp) { vp.textContent = c.vpnDone ? 'Answered' : 'Not finished'; vp.className = 'pill' + (c.vpnDone ? ' ok' : ''); }
    var steps = [
      [c.viewed >= TABS.length, c.viewed + ' of ' + TABS.length + ' opened'],
      [c.findings >= T.findings && !c.fNoType && !c.fNoAction, c.findings + ' of 10+ findings'],
      [c.vpnDone, c.vpnDone ? 'Answered' : 'Not finished'],
      [c.sharesDone >= E.shares.length, c.sharesDone + ' of ' + E.shares.length + ' shares'],
      [meta.status === 'submitted', meta.status === 'submitted' ? (meta.submitCount > 1 ? 'Resubmitted' : 'Submitted') : c.words + ' words, not submitted']
    ];
    steps.forEach(function (s, i) {
      var li = document.getElementById('st-' + (i + 1));
      if (!li) return;
      li.className = s[0] ? 'ok' : '';
      li.querySelector('small').textContent = s[1];
    });
    issue('iss-f', [
      c.fNoType ? plural(c.fNoType, 'finding needs', 'findings need') + ' a type and severity.' : '',
      c.fNoEvidence ? plural(c.fNoEvidence, 'finding has', 'findings have') + ' no evidence.' : '',
      c.fNoAction ? plural(c.fNoAction, 'finding needs', 'findings need') + ' a recommended action.' : '',
      c.fNoRank ? plural(c.fNoRank, 'finding needs', 'findings need') + ' a priority rank.' : ''
    ]);
    issue('iss-sh', [c.sharesNoOwner ? plural(c.sharesNoOwner, 'share needs', 'shares need') + ' an owner.' : '']);
    var wc = document.getElementById('wc');
    if (wc) { wc.textContent = plural(c.words, 'word', 'words') + ' (aim for 120 to 250)'; wc.className = 'wc' + (c.words >= 120 ? ' ok' : ''); }
    var cw = document.getElementById('wc-col');
    if (cw) cw.textContent = plural(words(S.vpn.colonial), 'word', 'words') + ' (aim for 3 to 5 sentences)';
    var b1 = document.getElementById('btn-p1'), s1 = document.getElementById('p1stat');
    if (b1 && s1) {
      if (part1Done) { b1.disabled = true; b1.textContent = 'Part 1 finished'; s1.textContent = 'Done. On Day 2, pick up at step 3.'; }
      else { b1.disabled = !part1Ready(c); b1.textContent = 'Finish part 1'; s1.textContent = 'Evidence tabs opened: ' + c.viewed + ' of 4. Findings logged: ' + c.findings + ' of 6.'; }
    }
    TABS.forEach(function (t) { var b = document.getElementById('tab-' + t[0]); if (b) b.classList.toggle('v', S.viewed.indexOf(t[0]) >= 0); });
    renderStatus();
  }
  function renderStatus() {
    var pill = document.getElementById('stat-pill'), btn = document.getElementById('btn-submit'), line = document.getElementById('sub-line');
    var t, cls;
    if (meta.status === 'submitted') {
      t = (meta.submitCount > 1 ? 'Resubmitted ' : 'Submitted ') + when(meta.submittedAt);
      cls = 'pill sub';

        '<li>Start with the bottom line in one sentence.</li>' +
        '<li>Lead with anything urgent, and say what has already been escalated.</li>' +
        '<li>Name the two or three biggest risks in plain words: what could happen to the business.</li>' +
        '<li>Say what to fix first and whether it is a quick change or a project.</li>' +
        '<li>Greg is on the list of people without MFA. Say so plainly and politely.</li>' +
        '<li>Skip acronyms, or explain them the first time.</li></ul></div></div>' +
      '<div class="done-bar"><div><b>Ready to turn it in?</b><div class="sub" id="sub-line"></div></div><button type="button" class="btn primary" id="btn-submit" data-act="submit">Submit for grading</button></div>' +
      '<div class="box confirm" id="confirm" tabindex="-1" role="region" aria-labelledby="cf-h" hidden></div></section>';
  }
  function render() {
    page.innerHTML = shell();
    renderEvidence(false);
    renderFindings();
    renderVpn();
    renderShares();
    document.getElementById('summary').value = S.summary;
    renderGrade();
    refresh();
  }

  // ---------- events ----------
  function onEdit(e) {
    var el = e.target;
    if (!S || !el.getAttribute) return;
    var ev = el.getAttribute('data-ev');
    if (ev) {
      if (ev === 'hrOnly') filt.hrOnly = el.checked; else filt[ev] = el.value;
      renderEvidence(true);
      return;
    }
    var t = el.getAttribute('data-t');
    if (!t) return;
    var f = el.getAttribute('data-f'), i = el.getAttribute('data-i');
    if (t === 'summary') { if (S.summary === el.value) return; S.summary = el.value; }
    else if (t === 'findings') { var r = S.findings[+i]; if (!r || r[f] === el.value) return; r[f] = el.value; }
    else if (t === 'vpn') { if (el.type === 'radio' && !el.checked) return; if (S.vpn[f] === el.value) return; S.vpn[f] = el.value; }
    else if (t === 'vpnset') {
      var arr = S.vpn[f], k = arr.indexOf(el.value);
      if (el.checked && k < 0) arr.push(el.value); else if (!el.checked && k >= 0) arr.splice(k, 1); else return;
      arr.sort();
    }
    else if (t === 'shares') { var s = S.shares[i]; if (!s || s[f] === el.value) return; s[f] = el.value; }
    else if (t === 'sharedata') {
      var d = S.shares[i].data, j = d.indexOf(el.value);
      if (el.checked && j < 0) d.push(el.value); else if (!el.checked && j >= 0) d.splice(j, 1); else return;
    }
    else return;
    changed();
  }
  page.addEventListener('input', onEdit);
  page.addEventListener('change', onEdit);
  page.addEventListener('click', function (e) {
    if (!S) return;
    var b = e.target.closest && e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'tab') openTab(b.getAttribute('data-tab'));
    else if (act === 'add') addFinding();
    else if (act === 'del') delFinding(+b.getAttribute('data-i'));
    else if (act === 'undo') undo();
    else if (act === 'sort') sortFindings();
    else if (act === 'finish1') finishPart1();
    else if (act === 'submit') showConfirm();
    else if (act === 'confirm-submit') doSubmit();
    else if (act === 'cancel-submit') { document.getElementById('confirm').hidden = true; document.getElementById('btn-submit').focus(); }
  });

  // ---------- start ----------
  Promise.all([fetchRemote(), CC.load().catch(function () { return {}; })]).then(function (res) {
    var remote = res[0], course = res[1] || {};
    remoteOk = remote.ok;
    var r = remote.val, l = readLocal();
    var rec = r || l, pushLocal = false;
    if (r && l && (l.savedAt || '') > (r.savedAt || '')) { rec = l; pushLocal = true; }
    if (!r && l && remoteOk) pushLocal = true;
    if (rec) {
      S = normData(rec.data);
      meta.status = rec.status === 'submitted' ? 'submitted' : 'draft';
      meta.submittedAt = rec.submittedAt || null;
      meta.submitCount = +rec.submitCount || (rec.submittedAt ? 1 : 0);
      meta.changedSinceSubmit = !!rec.changedSinceSubmit;
      meta.savedAt = rec.savedAt || null;
    } else S = normData({});
    meta.grade = (r && r.grade) || (rec && rec.grade) || null;
    part1Done = !!(course.done && course.done[PART1_BLOCK]);
    render();
    if (S.viewed.indexOf('acc') < 0) { S.viewed.push('acc'); refresh(); }
    if (meta.savedAt) setSave(remoteOk ? 'ok' : 'local', meta.savedAt);
    if (CC.online && !remoteOk) setSave('err');
    if (pushLocal) persist();
    if (CC.online && remoteOk) CC.db.ref(PATH + '/grade').on('value', function (s) { meta.grade = s.val(); renderGrade(); });
  });
})();
</script>
</body>
</html>
