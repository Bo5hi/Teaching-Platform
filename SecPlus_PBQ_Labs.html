<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<title>MCCoE Security+ PBQ Labs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..800&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab-range home (grouped lab rows) -> lab workspace (instructions | simulated screen) -> lab report */
:root {
  --bg: #f5f3f3; --surface: #ffffff; --ink: #1e1a1b; --muted: #675d5f; --line: #e2d9da;
  --accent: #9e1b32; --accent-ink: #ffffff; --accent-soft: #f7e4e7;
  --ok: #1d7348; --ok-soft: #e1f2e8; --mid: #8a5a00; --mid-soft: #fbf0d6; --bad: #b42318; --bad-soft: #fbe6e4;
  --scr-bg: #dfe5ec; --scr-win: #ffffff; --scr-ink: #1b1f24; --scr-muted: #59636e; --scr-line: #cdd5de; --scr-bar: #f1f4f7; --scr-sel: #d3e5ff; --scr-link: #0b5cad; --scr-btn: #2f6fb3; --scr-err: #b42318;
  --term-bg: #0d1520; --term-ink: #d8e2ec; --term-dim: #7f8d9b; --term-err: #ff9d8f; --term-cmd: #ffd27a;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161314; --surface: #211d1e; --ink: #f1ecec; --muted: #b3a8aa; --line: #3a3233;
    --accent: #e0566c; --accent-ink: #1a0f11; --accent-soft: #3d1d23;
    --ok: #5fcf95; --ok-soft: #173426; --mid: #e8b54d; --mid-soft: #382c12; --bad: #ff8a7a; --bad-soft: #3d1c19;
    --scr-bg: #2a3038; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161314; --surface: #211d1e; --ink: #f1ecec; --muted: #b3a8aa; --line: #3a3233;
  --accent: #e0566c; --accent-ink: #1a0f11; --accent-soft: #3d1d23;
  --ok: #5fcf95; --ok-soft: #173426; --mid: #e8b54d; --mid-soft: #382c12; --bad: #ff8a7a; --bad-soft: #3d1c19;
  --scr-bg: #2a3038; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
button { font: inherit; cursor: pointer; color: inherit; }
code { font-family: var(--font-mono); font-size: .9em; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 24px 56px; }
.eyebrow { font: 700 12px/1.2 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }

/* home */
.home-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 40px; align-items: end; border-bottom: 3px solid var(--ink); padding-bottom: 22px; }
.home-head h1 { font-size: clamp(38px, 6vw, 64px); font-weight: 800; font-stretch: 80%; letter-spacing: -.01em; }
.lede { max-width: 64ch; color: var(--muted); margin-top: 10px; }
.stats { display: flex; gap: 28px; }
.stat b { display: block; font: 800 34px/1 var(--font-display); font-stretch: 80%; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.group { margin-top: 30px; display: grid; gap: 8px; }
.group-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
.group-h h2 { font-size: 22px; font-weight: 800; font-stretch: 85%; }
.group-h span { color: var(--muted); font-size: 14px; }
.labrow { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto auto auto; gap: 14px 18px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.num { font: 600 20px var(--font-mono); color: var(--accent); }
.lr-main h3 { font-size: 18px; font-weight: 700; font-stretch: 90%; }
.lr-main p { color: var(--muted); font-size: 13.5px; }
.lr-min { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.lr-act { display: flex; gap: 8px; }
.chip { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
.chip.idle { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.mid { background: var(--mid-soft); color: var(--mid); } .chip.bad { background: var(--bad-soft); color: var(--bad); }
.home-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 28px; color: var(--muted); font-size: 13px; }
@media (max-width: 760px) {
  .home-head { grid-template-columns: 1fr; }
  .labrow { grid-template-columns: 36px minmax(0, 1fr); }
  .labrow .lr-min, .labrow .chip { grid-column: 2; justify-self: start; }
  .labrow .lr-act { grid-column: 1 / -1; }
}

/* lab workspace */
.labbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.lb-t { flex: 1 1 260px; min-width: 0; }
.lb-t h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; font-stretch: 85%; }
.timer { font: 600 15px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); padding: 0 6px; }
.labbody { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
.instr { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: grid; gap: 10px; font-size: 14px; max-height: 82vh; overflow: auto; }
.instr h2 { font-size: 18px; } .instr h3 { font-size: 15px; margin-top: 4px; }
.instr ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.instr ul ul { margin-top: 4px; gap: 2px; }
.tip { background: var(--accent-soft); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.tip b:first-child { color: var(--accent); margin-right: 4px; }
.tbl { overflow-x: auto; max-width: 100%; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.tbl th { background: var(--bg); }
.screen { position: relative; background: var(--scr-bg); border: 1px solid var(--line); border-radius: 8px; height: clamp(560px, 80vh, 880px); overflow: auto; display: flex; flex-direction: column; color: var(--scr-ink); font-size: 13.5px; }
@media (max-width: 960px) { .labbody { grid-template-columns: 1fr; } .instr { max-height: none; } }

/* drawer, overlay, toast */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(0,0,0,.18); z-index: 40; overflow: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) 18px; }
.dr-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.qs { padding-left: 20px; display: grid; gap: 16px; }
.qs p { margin-bottom: 6px; font-weight: 600; }
.qs input, .qs select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.qmulti { display: grid; gap: 6px; }
.dr-note { color: var(--muted); font-size: 13px; margin-top: 16px; }
.overlay { position: fixed; inset: 0; background: rgba(20,12,14,.5); z-index: 50; display: grid; place-items: center; padding: 16px; }
.ov-box { background: var(--surface); border-radius: 10px; padding: 22px; width: min(440px, 100%); display: grid; gap: 12px; }
.ov-box h2 { font-size: 22px; }
.ov-act { display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 60; font-size: 14px; max-width: calc(100% - 32px); }

/* report */
.rep-top { display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: center; margin-top: 20px; }
.rep-score { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-radius: 10px; }
.rep-score b { font: 800 48px/1 var(--font-display); font-stretch: 80%; font-variant-numeric: tabular-nums; }
.rep-score.ok { background: var(--ok-soft); color: var(--ok); } .rep-score.mid { background: var(--mid-soft); color: var(--mid); } .rep-score.bad { background: var(--bad-soft); color: var(--bad); }
.rep-meta { display: flex; gap: 28px; margin: 0; flex-wrap: wrap; }
.rep-meta dt { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); } .rep-meta dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.rep-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 28px; margin-top: 24px; }
.rep-cols h2 { font-size: 20px; margin-bottom: 10px; }
.rep-items { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.rep-items li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.rep-items .mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; }
.rep-items .ok .mark { background: var(--ok-soft); color: var(--ok); } .rep-items .bad .mark { background: var(--bad-soft); color: var(--bad); }
.rep-items p { font-size: 13.5px; margin-top: 3px; overflow-wrap: anywhere; } .rep-items p span { color: var(--muted); }
.rep-items .note { color: var(--bad); }
.rep-steps { margin: 0; padding-left: 22px; display: grid; gap: 10px; }
.rep-steps li { padding-left: 4px; }
.rep-act { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
@media (max-width: 860px) { .rep-cols { grid-template-columns: 1fr; } }

/* ---------- simulated screen (fixed desktop palette, like a real PC) ---------- */
.screen .err { color: var(--scr-err); font-size: 13px; }
.loc { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 7px 12px; background: #263240; color: #e5ebf1; font-size: 12.5px; }
.loc i { color: #8fa1b3; font-style: normal; margin: 0 2px; }
.loc-dev select { margin-left: 6px; font: inherit; padding: 2px 6px; border-radius: 4px; border: 0; background: #e5ebf1; color: #1b1f24; }
.desk { flex: 1; padding: 12px; display: flex; flex-direction: column; min-height: 0; position: relative; }
.win { background: var(--scr-win); border: 1px solid var(--scr-line); border-radius: 8px; box-shadow: 0 6px 24px rgba(15,25,40,.18); display: flex; flex-direction: column; min-height: 0; flex: 1; overflow: hidden; color: var(--scr-ink); }
.titlebar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--scr-bar); border-bottom: 1px solid var(--scr-line); font-size: 12.5px; font-weight: 600; }
.titlebar .x, .ws-menu .x { border: 0; background: none; font-size: 18px; line-height: 1; padding: 0 4px; }
.sbtn { background: var(--scr-btn); color: #fff; border: 1px solid var(--scr-btn); border-radius: 4px; padding: 5px 12px; font-size: 13px; }
.sbtn.ghost { background: #fff; color: var(--scr-ink); border-color: var(--scr-line); }
.sbtn:disabled { opacity: .45; cursor: not-allowed; }
.lnk { background: none; border: 0; color: var(--scr-link); padding: 0; text-decoration: underline; font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.screen .f { display: grid; gap: 3px; margin-bottom: 10px; max-width: 460px; }
.screen .f > span, .screen .chk .lbl { font-size: 12px; font-weight: 600; color: var(--scr-muted); }
.screen .chk .lbl { display: block; margin-bottom: 2px; }
.screen .f input, .screen .f select { font: inherit; padding: 5px 8px; border: 1px solid var(--scr-line); border-radius: 4px; background: #fff; color: var(--scr-ink); width: 100%; }
.screen .f input[readonly] { background: var(--scr-bar); }
.screen .f small { color: var(--scr-muted); font-size: 11.5px; }
.rads { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.rad, .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.screen .chk { display: flex; margin-bottom: 8px; }
.kv { display: flex; gap: 8px; font-size: 13px; margin-bottom: 8px; } .kv span { color: var(--scr-muted); }
.kvl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 0; font-size: 13px; } .kvl dt { color: var(--scr-muted); } .kvl dd { margin: 0; }
.dlg-back { position: absolute; inset: 0; background: rgba(20,30,45,.35); display: grid; place-items: center; padding: 12px; z-index: 5; }
.dlg { background: #fff; color: var(--scr-ink); border-radius: 6px; width: min(460px, 100%); max-height: 100%; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,.3); }
.dlg-t { padding: 8px 12px; background: var(--scr-bar); border-bottom: 1px solid var(--scr-line); font-weight: 700; font-size: 13px; }
.dlg-b { padding: 14px; } .dlg-f { padding: 10px 14px; border-top: 1px solid var(--scr-line); display: flex; gap: 8px; justify-content: flex-end; }
.sw-t { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.sw-t th, .sw-t td { border-bottom: 1px solid var(--scr-line); padding: 5px 8px; text-align: left; white-space: nowrap; }
.sw-t th { background: var(--scr-bar); font-weight: 600; position: sticky; top: 0; }
.sw-t tr.on td { background: var(--scr-sel); }
.vs-empty { color: var(--scr-muted); padding: 16px 0; }

/* browser */
.br-tabs { background: #dfe4ea; padding: 6px 8px 0; } .br-tab { display: inline-block; background: #fff; padding: 5px 14px; border-radius: 6px 6px 0 0; font-size: 12px; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.br-bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--scr-line); }
.br-nav { color: var(--scr-muted); letter-spacing: 4px; font-size: 15px; }
.br-addr { flex: 1; min-width: 0; border: 1px solid var(--scr-line); border-radius: 99px; padding: 5px 12px; font: 13px var(--font-body); background: var(--scr-bar); color: var(--scr-ink); }
.br-page { flex: 1; overflow: auto; position: relative; min-height: 0; }
.br-status { height: 22px; font-size: 11.5px; padding: 3px 10px; color: var(--scr-muted); border-top: 1px solid var(--scr-line); background: var(--scr-bar); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); }
.newtab { display: grid; place-items: center; align-content: center; gap: 8px; height: 100%; min-height: 260px; text-align: center; color: var(--scr-muted); padding: 20px; }
.newtab-mark { font: 800 28px var(--font-display); color: #9aa6b2; }
.newtab h2 { color: var(--scr-ink); font-size: 22px; }

/* lab 1 bank */
.bank-h { background: #0f3d5c; color: #fff; padding: 14px 20px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; } .bank-h b { font: 800 20px var(--font-display); } .bank-h span { opacity: .8; font-size: 13px; }
.bank-body { padding: 20px; display: grid; gap: 10px; max-width: 760px; }
.bank-l { font-weight: 600; } .bank-form { display: flex; gap: 8px; } .bank-q { flex: 1; min-width: 0; font: 15px var(--font-mono); padding: 7px 10px; border: 1px solid var(--scr-line); border-radius: 4px; }
.bank-out { display: grid; gap: 4px; font-size: 13.5px; } .bank-err { color: var(--scr-err); font-weight: 600; } .bank-pre { background: #0d1520; color: #d8e2ec; padding: 8px 10px; border-radius: 4px; margin: 4px 0 0; }

/* lab 2 terminal */
.term { background: var(--term-bg); border-color: #22303f; } .term .titlebar { background: #1b2633; color: #d8e2ec; border-color: #22303f; }
.term-out { flex: 1; overflow: auto; padding: 10px 12px; font: 13px/1.45 var(--font-mono); color: var(--term-ink); cursor: text; min-height: 0; }
.tl { white-space: pre-wrap; overflow-wrap: anywhere; } .tl.err { color: var(--term-err); } .tl.cmdl { color: var(--term-cmd); }
.tin { display: flex; gap: 0; } .tin span { white-space: pre; color: var(--term-cmd); }
.term-in { flex: 1; min-width: 80px; background: transparent; border: 0; color: var(--term-ink); font: inherit; outline: none; caret-color: #ffd27a; }

/* lab 3 mail */
.mail { display: flex; flex-direction: column; height: 100%; min-height: 420px; }
.mail-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 12px; background: #1d4f8a; color: #fff; } .mail-top span { opacity: .85; font-size: 12.5px; }
.mail-tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; } .mail-tools .sbtn { background: #fff; color: #1d4f8a; border-color: #fff; } .mail-tools .sbtn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
.mail-cols { flex: 1; display: grid; grid-template-columns: 130px 270px minmax(0, 1fr); min-height: 0; }
.mail-nav { border-right: 1px solid var(--scr-line); padding: 8px; display: grid; align-content: start; gap: 2px; background: var(--scr-bar); }
.mail-nav button { text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 4px; display: flex; justify-content: space-between; } .mail-nav button.on { background: var(--scr-sel); font-weight: 700; }
.mail-list { border-right: 1px solid var(--scr-line); overflow: auto; min-height: 0; }
.mrow { display: grid; gap: 1px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--scr-line); background: #fff; padding: 8px 10px; }
.mrow.on { background: var(--scr-sel); } .mrow b { font-size: 13px; } .mrow span { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .mrow small { color: var(--scr-muted); font-size: 11.5px; }
.sig { font-style: normal; color: #1d7348; }
.mail-read { padding: 14px 18px; overflow: auto; min-height: 0; display: grid; align-content: start; gap: 10px; }
.mail-read h3 { font-size: 18px; } .mhead { color: var(--scr-muted); font-size: 12.5px; overflow-wrap: anywhere; }
.msig { background: #e1f2e8; color: #1d7348; padding: 5px 8px; border-radius: 4px; font-size: 12.5px; }
.mbody { display: grid; gap: 10px; max-width: 62ch; } .mbody a { color: var(--scr-link); } .mbody blockquote { margin: 0; padding-left: 10px; border-left: 3px solid var(--scr-line); color: var(--scr-muted); }
.att { border: 1px solid var(--scr-line); background: var(--scr-bar); border-radius: 4px; padding: 4px 10px; font-size: 12.5px; }
.mail-empty { color: var(--scr-muted); padding: 14px; }
@media (max-width: 700px) { .mail-cols { grid-template-columns: 1fr; } .mail-nav { grid-auto-flow: column; overflow-x: auto; } .mail-list { max-height: 220px; border-right: 0; border-bottom: 1px solid var(--scr-line); } }

/* lab 4 switch */
.sw { display: flex; flex-direction: column; height: 100%; min-height: 440px; position: relative; }
.sw-top { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 8px 14px; background: #0b3b5b; color: #fff; } .sw-top b { font: 800 17px var(--font-display); } .sw-top span { font-size: 12.5px; opacity: .85; } .sw-u { margin-left: auto; }
.sw-cols { flex: 1; display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 0; }
.sw-nav { background: var(--scr-bar); border-right: 1px solid var(--scr-line); overflow: auto; padding: 6px 0; }
.sw-nl { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 12px; font-size: 13px; } .sw-nl.grp { font-weight: 600; } .sw-nl.on { background: var(--scr-sel); font-weight: 700; }
.sw-sub .sw-nl { padding-left: 26px; }
.sw-main { padding: 14px; overflow: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.sw-main .tbl { flex: 1; min-height: 120px; overflow: auto; }
.sw-h { font-size: 19px; } .sw-p { color: var(--scr-muted); font-size: 12.5px; }
.sw-btns { display: flex; gap: 8px; } .dn { color: var(--scr-err); font-weight: 700; }

<body>
<header class="brandbar"><div class="brandbar-in"><img src="assets/mccoe-logo.png" alt="MCCoE: Missouri Cybersecurity Center of Excellence" width="500" height="500"><span>Security+ PBQ Labs</span></div></header>
<div id="hubbar" role="status"></div>
<div id="app"><div class="wrap"><p class="eyebrow">MCCoE · Security+ PBQ Labs</p><h1>Loading labs…</h1></div></div>
<div class="drawer" id="drawer" hidden></div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* MCCoE Security+ PBQ Labs: app core (home, lab workspace, questions, scoring, reports) */
(function () {
  'use strict';
  var P = window.PBQ = window.PBQ || {};
  P.labs = P.labs || [];

  /* ---------- small helpers shared by every lab ---------- */
  var esc = P.esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  P.rand = function (n) { return Math.floor(Math.random() * n); };
  P.pick = function (a) { return a[P.rand(a.length)]; };
  P.hex = function (n) { var s = ''; for (var i = 0; i < n; i++) s += '0123456789abcdef'[P.rand(16)]; return s; };
  P.normUrl = function (u) {
    return String(u || '').trim().toLowerCase().replace(/^[a-z]+:\/\//, '').replace(/^www\./, '').replace(/\/+$/, '');
  };
  P.get = function (o, path) { return path.split('.').reduce(function (a, k) { return a == null ? a : a[k]; }, o); };
  P.set = function (o, path, v) {
    var ks = path.split('.'), last = ks.pop();
    var t = ks.reduce(function (a, k) { if (a[k] == null) a[k] = {}; return a[k]; }, o);
    t[last] = v;
  };
  P.pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
  P.mmss = function (secs) { secs = Math.max(0, Math.round(secs)); return P.pad2(Math.floor(secs / 60)) + ':' + P.pad2(secs % 60); };

  /* location bar (building > floor > room > device) */
  P.loc = function (path, devices, device) {
    var dev = '';
    if (devices && devices.length > 1) {
      dev = '<label class="loc-dev">Device <select data-a="device" aria-label="Switch device">' +
        devices.map(function (d) { return '<option' + (d === device ? ' selected' : '') + '>' + esc(d) + '</option>'; }).join('') +
        '</select></label>';
    }
    return '<div class="loc"><span class="loc-path">' + path.map(esc).join(' <i>›</i> ') + '</span>' + dev + '</div>';
  };

  /* simulated browser window */
  P.browser = function (br, tabTitle, content) {
    return '<div class="win br"><div class="br-tabs"><span class="br-tab">' + esc(tabTitle || 'New Tab') + '</span></div>' +
      '<div class="br-bar"><span class="br-nav" aria-hidden="true">&#8249; &#8250; &#8635;</span>' +
      '<input class="br-addr" data-a="addr" value="' + esc(br.url || '') + '" placeholder="Type an address and press Enter" spellcheck="false" autocomplete="off" aria-label="Address bar"></div>' +
      '<div class="br-page" data-scroll="page">' + content + '</div>' +
      '<div class="br-status" aria-live="off"></div></div>';
  };
  P.newTab = function () {
    return '<div class="newtab"><div class="newtab-mark">New Tab</div><p>Type an address in the bar above and press Enter.</p></div>';
  };
  P.unreachable = function (url) {
    return '<div class="newtab"><h2>This site can’t be reached</h2><p><b>' + esc(url) + '</b> took too long to respond. Check the address and try again.</p></div>';
  };
  /* handle Enter in the address bar. resolve(normalizedUrl) returns a site key or null */
  P.browserKey = function (e, br, resolve, ctx) {
    if (e.type === 'keydown' && e.key === 'Enter' && e.target.classList.contains('br-addr')) {
      br.url = e.target.value.trim();
      br.site = br.url ? resolve(P.normUrl(br.url)) : null;
      br.page = null;
      ctx.update();
      return true;
    }
    return false;
  };

  /* dialog inside the simulated screen */
  P.dlg = function (title, body, buttons, cls) {
    return '<div class="dlg-back"><div class="dlg ' + (cls || '') + '" role="dialog" aria-label="' + esc(title) + '">' +
      '<div class="dlg-t">' + esc(title) + '</div><div class="dlg-b">' + body + '</div><div class="dlg-f">' + buttons + '</div></div></div>';
  };

  /* bound form controls: data-bind="path" writes into the lab state */
  P.field = function (label, bind, val, o) {
    o = o || {};
    return '<label class="f"><span>' + label + '</span><input' + (o.type ? ' type="' + o.type + '"' : '') +
      ' data-bind="' + bind + '" value="' + esc(val == null ? '' : val) + '"' + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') +
      (o.ro ? ' readonly' : '') + ' spellcheck="false" autocomplete="off"' + (o.id ? ' id="' + o.id + '"' : '') + '>' +
      (o.help ? '<small>' + o.help + '</small>' : '') + '</label>';
  };
  P.select = function (label, bind, val, options, o) {
    o = o || {};
    return '<label class="f"><span>' + label + '</span><select data-bind="' + bind + '"' + (o.rr ? ' data-rerender' : '') + '>' +
      options.map(function (x) { return '<option' + (x === val ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') +
      '</select>' + (o.help ? '<small>' + o.help + '</small>' : '') + '</label>';
  };
  P.radios = function (name, bind, val, options, rr) {
    return '<div class="rads">' + options.map(function (x) {
      return '<label class="rad"><input type="radio" name="' + name + '" data-bind="' + bind + '" value="' + esc(x) + '"' +
        (x === val ? ' checked' : '') + (rr ? ' data-rerender' : '') + '> ' + esc(x) + '</label>';
    }).join('') + '</div>';
  };
  P.check = function (label, bind, val, rr) {
    return '<label class="chk"><input type="checkbox" data-bind="' + bind + '"' + (val ? ' checked' : '') + (rr ? ' data-rerender' : '') + '> ' + label + '</label>';
  };

  /* ---------- storage (per-viewer convenience only) ---------- */
  var KEY = 'mccoe-pbq-labs-v1';
  var store = { results: {} };
  try { var saved = JSON.parse(localStorage.getItem(KEY)); if (saved && saved.results) store = saved; } catch (e) { /* storage unavailable */ }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* ignore */ } }

  var app, sess = null, clock = null;
  var CATS = [
    ['Detect', 'Find the attack in the evidence'],
    ['Verify', 'Prove a file or system is safe'],
    ['Harden', 'Change defaults and lock devices down'],
    ['Trust', 'Manage certificates and remote access']
  ];
  function labs() { return P.labs.slice().sort(function (a, b) { return a.num - b.num; }); }
  function byId(id) { return P.labs.filter(function (l) { return l.id === id; })[0]; }
  function stopAll() {
    if (clock) { clearInterval(clock); clock = null; }
    if (sess) { sess.timers.forEach(clearInterval); sess.timers = []; }
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.hidden = true; }, 2600);
  }
  P.toast = toast;

  /* ---------- home ---------- */
  function home() {
    stopAll(); sess = null;
    var all = labs(), res = store.results;
    var scored = all.filter(function (l) { return res[l.id]; });
    var total = all.length ? Math.round(all.reduce(function (a, l) { return a + (res[l.id] ? res[l.id].score : 0); }, 0) / all.length) : 0;
    var html = '<div class="wrap">' +
      '<header class="home-head"><div class="hh-text"><p class="eyebrow">MCCoE · CompTIA Security+ V8 (SY0-801)</p>' +
      '<h1>PBQ Lab Set</h1><p class="lede">Ten hands-on labs that follow the CertMaster <b>A.2.1 Skills Practice</b> tasks. ' +
      'Each lab is graded task by task when you click <b>Score Lab</b>, then shows a lab report with the correct steps. ' +
      'Budget about 6 minutes per lab. The set passes at 80%.</p></div>' +
      '<div class="stats"><div class="stat"><b>' + total + '%</b><span>Set score</span></div>' +
      '<div class="stat"><b>' + scored.length + '/' + all.length + '</b><span>Labs scored</span></div>' +
      '<div class="stat"><b>80%</b><span>To pass</span></div></div></header>';
    CATS.forEach(function (c) {
      var ls = all.filter(function (l) { return l.cat === c[0]; });
      if (!ls.length) return;
      html += '<section class="group"><div class="group-h"><h2>' + c[0] + '</h2><span>' + c[1] + '</span></div>';
      ls.forEach(function (l) {
        var r = res[l.id];
        var chip = r ? '<span class="chip ' + (r.score === 100 ? 'ok' : r.score >= 50 ? 'mid' : 'bad') + '">Scored ' + r.score + '%</span>' : '<span class="chip idle">Not started</span>';
        html += '<article class="labrow"><span class="num">' + P.pad2(l.num) + '</span>' +
          '<div class="lr-main"><h3>' + esc(l.title) + '</h3><p>' + esc(l.skills) + '</p></div>' +
          '<span class="lr-min">~' + l.mins + ' min</span>' + chip +
          '<div class="lr-act">' + (r ? '<button class="btn" data-act="report" data-id="' + l.id + '">Report</button>' : '') +
          '<button class="btn primary" data-act="launch" data-id="' + l.id + '">' + (r ? 'Retry' : 'Launch') + '</button></div></article>';
      });
      html += '</section>';
    });
    html += '<footer class="home-foot"><span>Scores are saved in this browser only.</span>' +
      (scored.length ? '<button class="btn ghost" data-act="clear">Clear my scores</button>' : '') + '</footer></div>';
    app.innerHTML = html;
    if (location.hash && location.hash !== '#home') history.replaceState(null, '', '#home');
    window.scrollTo(0, 0);
  }

  /* ---------- lab workspace ---------- */
  function launch(id) {
    var lab = byId(id);
    if (!lab) return home();
    stopAll();
    sess = { lab: lab, s: lab.init(), answers: {}, start: Date.now(), timers: [] };
    var hash = '#lab-' + lab.num;
    if (location.hash !== hash) history.replaceState(null, '', hash);
    renderLab();
  }

  var ctx = {
    update: function () { draw(); },
    toast: toast,
    notSim: function () { toast('This feature has not been simulated.'); },
    every: function (fn, ms) { var t = setInterval(fn, ms); if (sess) sess.timers.push(t); return t; },
    stop: function (t) { clearInterval(t); if (sess) sess.timers = sess.timers.filter(function (x) { return x !== t; }); },
    screen: function () { return document.getElementById('screen'); }
  };

  function renderLab() {
    var L = sess.lab;
    var hasQ = L.questions && L.questions.length;
    app.innerHTML = '<div class="wrap lab">' +
      '<header class="labbar"><button class="btn ghost" data-act="home">← All labs</button>' +
      '<div class="lb-t"><p class="eyebrow">Lab ' + P.pad2(L.num) + ' · ' + L.cat + '</p><h1>' + esc(L.title) + '</h1></div>' +
      '<span class="timer" id="timer" title="Time spent in this lab">00:00</span>' +
      (hasQ ? '<button class="btn" data-act="q">Questions</button>' : '') +
      '<button class="btn" data-act="restart">Restart</button>' +
      '<button class="btn primary" data-act="score">Score Lab</button></header>' +
      '<div class="labbody"><aside class="instr" aria-label="Lab instructions"><h2>Instructions</h2>' + L.scenario +
      '<h3>In this lab, your task is to:</h3><ul class="tasks">' + L.tasks.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
      (L.tips || []).map(function (t) { return '<p class="tip"><b>Tip</b> ' + t + '</p>'; }).join('') +
      (hasQ ? '<p class="tip"><b>Questions</b> Open <b>Questions</b> in the bar above to answer. Answers save as you type.</p>' : '') +
      '</aside><section class="screen" id="screen" aria-label="Lab simulation"></section></div></div>';
    var screen = document.getElementById('screen');
    ['click', 'dblclick', 'change', 'input', 'keydown', 'contextmenu', 'mouseover', 'mouseout', 'submit'].forEach(function (type) {
      screen.addEventListener(type, function (e) { onScreen(type, e); });
    });
    draw();
    clock = setInterval(function () {
      var t = document.getElementById('timer');
      if (t && sess) t.textContent = P.mmss((Date.now() - sess.start) / 1000);
    }, 1000);
    window.scrollTo(0, 0);
  }

  function onScreen(type, e) {
    if (!sess) return;
    var s = sess.s;
    if (type === 'submit') e.preventDefault();
    if (type === 'input' || type === 'change') {
      var b = e.target.closest('[data-bind]');
      if (b) {
        if (b.type === 'radio' && !b.checked) return;
        P.set(s, b.dataset.bind, b.type === 'checkbox' ? b.checked : b.value);
        if (type === 'change' && b.hasAttribute('data-rerender')) { draw(); return; }
      }
    }
    if (type === 'mouseover' || type === 'mouseout') {
      var l = e.target.closest('[data-href]');
      var bar = document.querySelector('#screen .br-status');
      if (bar) bar.textContent = (type === 'mouseover' && l) ? l.dataset.href : '';
    }
    if (sess.lab.on) sess.lab.on(type, e, s, ctx);
  }

  function draw() {
    var screen = document.getElementById('screen');
    if (!screen || !sess) return;
    var keep = {};
    screen.querySelectorAll('[data-scroll]').forEach(function (el) { keep[el.dataset.scroll] = [el.scrollTop, el.scrollLeft]; });
    var active = document.activeElement, focusBind = active && screen.contains(active) && active.dataset ? (active.dataset.bind || active.dataset.a || '') : '';
    screen.innerHTML = sess.lab.view(sess.s, ctx);
    screen.querySelectorAll('[data-scroll]').forEach(function (el) {
      var k = keep[el.dataset.scroll]; if (k) { el.scrollTop = k[0]; el.scrollLeft = k[1]; }
    });
    screen.querySelectorAll('[data-stick]').forEach(function (el) { el.scrollTop = el.scrollHeight; });
    var af = screen.querySelector('[data-autofocus]');
    if (af) af.focus({ preventScroll: true });
    else if (focusBind) {
      var again = screen.querySelector('[data-bind="' + focusBind + '"],[data-a="' + focusBind + '"]');
      if (again && again.tagName !== 'BUTTON') again.focus({ preventScroll: true });
    }
  }

  /* ---------- questions drawer ---------- */
  function openQuestions() {
    var L = sess.lab, a = sess.answers, d = document.getElementById('drawer');
    d.innerHTML = '<div class="dr-head"><h2>Lab questions</h2><button class="btn ghost" data-act="qclose">Close</button></div>' +
      '<ol class="qs">' + L.questions.map(function (q) {
        var v = a[q.id], inner;
        if (q.type === 'select') {
          inner = '<select data-q="' + q.id + '" id="q-' + q.id + '"><option value="">Select an answer</option>' + q.options.map(function (o) {
            return '<option' + (v === o ? ' selected' : '') + '>' + esc(o) + '</option>';
          }).join('') + '</select>';
        } else if (q.type === 'multi') {
          var cur = v || [];
          inner = '<div class="qmulti">' + q.options.map(function (o, i) {
            return '<label class="chk"><input type="checkbox" data-qm="' + q.id + '" value="' + esc(o) + '" id="q-' + q.id + '-' + i + '"' + (cur.indexOf(o) >= 0 ? ' checked' : '') + '> ' + esc(o) + '</label>';
          }).join('') + '</div>';
        } else {
          inner = '<input data-q="' + q.id + '" id="q-' + q.id + '" value="' + esc(v || '') + '" placeholder="' + esc(q.ph || 'Type your answer') + '" autocomplete="off" spellcheck="false">';
        }
        return '<li><p>' + q.text + '</p>' + inner + '</li>';
      }).join('') + '</ol><p class="dr-note">Answers are graded when you click <b>Score Lab</b>.</p>';
    d.hidden = false;
    var first = d.querySelector('input,select'); if (first) first.focus();
  }
  function onDrawer(e) {
    if (!sess) return;
    var t = e.target;
    if (t.dataset.q) sess.answers[t.dataset.q] = t.value;
    if (t.dataset.qm) {
      var q = t.dataset.qm, cur = (sess.answers[q] || []).filter(function (x) { return x !== t.value; });
      if (t.checked) cur.push(t.value);
      sess.answers[q] = cur;
    }
  }

  /* ---------- overlay confirm ---------- */
  function confirmBox(title, text, okLabel, onOk) {
    var o = document.getElementById('overlay');
    o.innerHTML = '<div class="ov-box" role="dialog" aria-label="' + esc(title) + '"><h2>' + esc(title) + '</h2><p>' + text + '</p>' +
      '<div class="ov-act"><button class="btn" data-act="ovcancel">Cancel</button><button class="btn primary" data-act="ovok">' + esc(okLabel) + '</button></div></div>';
    o.hidden = false;
    confirmBox.ok = onOk;
    o.querySelector('[data-act="ovok"]').focus();
  }
  function closeOverlay() { var o = document.getElementById('overlay'); o.hidden = true; o.innerHTML = ''; }

  /* ---------- scoring and report ---------- */
  function scoreLab() {
    var L = sess.lab, s = sess.s;
    var items = L.grade(s, sess.answers) || [];
    var ok = items.filter(function (i) { return i.ok; }).length;
    var result = {
      score: items.length ? Math.round(100 * ok / items.length) : 0,
      items: items,
      explain: L.explain(s),
      secs: Math.round((Date.now() - sess.start) / 1000),
      at: new Date().toLocaleString()
    };
    store.results[L.id] = result; persist();
    stopAll();
    report(L.id);
    if (typeof P.onScored === 'function') { try { P.onScored(L, result); } catch (e) { /* reporting is optional */ } }
  }

  function report(id) {
    var L = byId(id), r = store.results[id];
    if (!L || !r) return home();
    stopAll(); sess = null;
    var pass = r.score === 100;
    var all = labs(), idx = all.indexOf(L), next = all[idx + 1];
    var html = '<div class="wrap report">' +
      '<header class="labbar"><button class="btn ghost" data-act="home">← All labs</button>' +
      '<div class="lb-t"><p class="eyebrow">Lab report · Lab ' + P.pad2(L.num) + '</p><h1>' + esc(L.title) + '</h1></div></header>' +
      '<div class="rep-top"><div class="rep-score ' + (pass ? 'ok' : r.score >= 50 ? 'mid' : 'bad') + '"><b>' + r.score + '%</b><span>' +
      (pass ? 'You completed the lab correctly.' : 'You did not complete the lab correctly.') + '</span></div>' +
      '<dl class="rep-meta"><div><dt>Time spent</dt><dd>' + P.mmss(r.secs) + '</dd></div><div><dt>Scored</dt><dd>' + esc(r.at) + '</dd></div>' +
      '<div><dt>Tasks passed</dt><dd>' + r.items.filter(function (i) { return i.ok; }).length + ' of ' + r.items.length + '</dd></div></dl></div>' +
      '<div class="rep-cols"><section><h2>Task summary</h2><ol class="rep-items">' + r.items.map(function (i) {
        return '<li class="' + (i.ok ? 'ok' : 'bad') + '"><span class="mark" aria-label="' + (i.ok ? 'Passed' : 'Failed') + '">' + (i.ok ? '✓' : '✗') + '</span><div><b>' + esc(i.label) + '</b>' +
          (i.your != null ? '<p><span>Your answer:</span> ' + esc(Array.isArray(i.your) ? i.your.join(', ') : (i.your === '' ? '(blank)' : i.your)) + '</p>' : '') +
          (i.correct != null && !i.ok ? '<p><span>Correct answer:</span> ' + esc(i.correct) + '</p>' : '') +
          (i.note ? '<p class="note">' + esc(i.note) + '</p>' : '') + '</div></li>';
      }).join('') + '</ol></section>' +
      '<section><h2>Explanation</h2><ol class="rep-steps">' + r.explain.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ol></section></div>' +
      '<div class="rep-act"><button class="btn primary" data-act="launch" data-id="' + L.id + '">Retry lab</button>' +
      (next ? '<button class="btn" data-act="launch" data-id="' + next.id + '">Next: Lab ' + P.pad2(next.num) + ' →</button>' : '') +
      '<button class="btn ghost" data-act="home">All labs</button></div></div>';
    app.innerHTML = html;
    history.replaceState(null, '', '#report-' + L.num);
    window.scrollTo(0, 0);
  }

  /* ---------- global click routing ---------- */
  function onApp(e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act;
    if (act === 'home') {
      if (sess && document.getElementById('screen')) {
        confirmBox('Leave this lab?', 'Your work in this lab has not been scored and will be lost.', 'Leave lab', home);
      } else home();
    } else if (act === 'launch') launch(b.dataset.id);
    else if (act === 'report') report(b.dataset.id);
    else if (act === 'q') openQuestions();
    else if (act === 'qclose') document.getElementById('drawer').hidden = true;
    else if (act === 'restart') confirmBox('Restart this lab?', 'Everything you have done in this lab, including your answers, will be reset.', 'Restart', function () { launch(sess.lab.id); });
    else if (act === 'score') confirmBox('Submit for a score?', 'Once you click <b>Score</b> you can’t make any more changes to your work. You can retry the lab from the start afterward.', 'Score', scoreLab);
    else if (act === 'ovcancel') closeOverlay();
    else if (act === 'ovok') { var fn = confirmBox.ok; closeOverlay(); document.getElementById('drawer').hidden = true; if (fn) fn(); }
    else if (act === 'clear') confirmBox('Clear all scores?', 'This removes every saved lab score from this browser.', 'Clear scores', function () { store = { results: {} }; persist(); home(); });
  }

  function route() {
    var m = /^#(lab|report)-(\d+)$/.exec(location.hash || '');
    if (m) {
      var lab = P.labs.filter(function (l) { return l.num === +m[2]; })[0];
      if (lab) {
        if (m[1] === 'lab') { if (!sess || sess.lab !== lab) launch(lab.id); return; }
        if (store.results[lab.id]) { report(lab.id); return; }
      }
    }
    if (!sess) home();
  }

  document.addEventListener('DOMContentLoaded', function () {
    app = document.getElementById('app');
    document.body.addEventListener('click', onApp);
    var d = document.getElementById('drawer');
    d.addEventListener('input', onDrawer); d.addEventListener('change', onDrawer);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeOverlay(); document.getElementById('drawer').hidden = true; }
    });
    window.addEventListener('hashchange', route);
    route();
  });
})();

</script>

    function arpReq(sip, tip) { add({ proto: 'ARP', len: 60, esrc: hosts[sip] || gw, edst: 'ff:ff:ff:ff:ff:ff', arp: { op: 1, smac: hosts[sip] || gw, sip: sip, tmac: '00:00:00:00:00:00', tip: tip }, info: 'Who has ' + tip + '? Tell ' + sip }); }

    function dns(q) { add({ proto: 'DNS', len: 86, esrc: hosts['10.10.5.30'], edst: gw, ip: { src: '10.10.5.30', dst: '10.10.5.1' }, info: 'Standard query 0x' + P.hex(4) + ' A ' + q }); }
    function ssdp(src) { add({ proto: 'SSDP', len: 167, esrc: hosts[src], edst: '01:00:5e:7f:ff:fa', ip: { src: src, dst: '239.255.255.250' }, info: 'M-SEARCH * HTTP/1.1' }); }

  try {
    if (!name) name = localStorage.getItem('hub_name') || '';
    if (!id) id = localStorage.getItem('hub_id') || '';
    if (name) localStorage.setItem('hub_name', name);
    if (id) localStorage.setItem('hub_id', id);
  } catch (e) { /* storage unavailable */ }
  var key = id ? id.replace(/[.#$[\]]/g, '_') : null;
  var startLab = q.get('lab');
  if (startLab && /^\d{1,2}$/.test(startLab) && !location.hash) {
    try { history.replaceState(null, '', location.pathname + location.search + '#lab-' + (+startLab)); } catch (e) { /* ignore */ }
  }
  var db = null;
  try {
    if (window.firebase) {
      if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
    }
  } catch (e) { db = null; }

  document.addEventListener('DOMContentLoaded', function () {
    var bar = document.getElementById('hubbar');
    if (!bar) return;
    var hub = 'MCCoE_Hub.html' + (name || id ? '?name=' + encodeURIComponent(name) + '&id=' + encodeURIComponent(id) : '');
    if (key) {
      bar.innerHTML = '<span><b>' + P.esc(name || id) + '</b> · Scores save to your instructor’s tracker</span><a href="' + hub + '">Back to Hub</a>';
    } else {
      bar.innerHTML = '<span>You aren’t signed in, so scores stay in this browser only. Sign in at the Hub and open the labs from there to send scores to your instructor.</span><a href="MCCoE_Hub.html">Go to Hub</a>';
      bar.classList.add('warn');
    }
  });

  P.onScored = function (L, r) {
    if (!db || !key) { P.toast('Not signed in: this score was saved in this browser only.'); return; }
    var now = new Date().toISOString();
    var ref = db.ref('mccoe_pbq/' + key);
    ref.child('labs/' + L.id).transaction(function (prev) {
      prev = prev || {};
      return {
        num: L.num, title: L.title, last: r.score,
        best: Math.max(prev.best || 0, r.score),
        attempts: (prev.attempts || 0) + 1,
        secs: r.secs, at: now,
        missed: r.items.filter(function (i) { return !i.ok; }).map(function (i) { return i.label; }).slice(0, 12)
      };
    }, function (err, committed) {
      if (err || !committed) P.toast('Couldn’t reach the tracker. Your score is saved in this browser.');
      else P.toast('Score sent to your instructor’s tracker.');
    });
    ref.update({ name: name, id: id, lastActivity: now });
  };
})();

</script>
